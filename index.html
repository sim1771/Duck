<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1720" />
    <title>Cadastre Chasse 🦆</title>

    <!-- Leaflet (fourni localement — aucune dépendance CDN) -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="css/style.css?v=9" />
  </head>
  <body>
    <div id="map"></div>

    <!-- Barre supérieure : recherche par lien / coordonnées -->
    <div class="topbar">
      <span class="brand-mini">🦆</span>
      <input
        id="searchInput"
        class="search-input"
        type="text"
        inputmode="url"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Lien Google Maps ou coordonnées…"
      />
      <button id="searchBtn" class="icon-btn" title="Chercher">🔍</button>
      <div id="basemapChip" class="chip">🛰️</div>
    </div>

    <!-- Boutons flottants -->
    <div class="fabs">
      <button id="followFab" class="fab" title="Me suivre">📍</button>
    </div>

    <!-- Bouton principal -->
    <button id="primaryBtn" class="primary-btn">
      <span>🎯</span> Propriétaire ici
    </button>

    <!-- Feuille de résultat -->
    <div id="sheet" class="sheet">
      <div class="grip"></div>
      <div class="sheet-head">
        <div id="sheetOwner" class="owner"></div>
        <button id="closeSheet" class="close-x" aria-label="Fermer">✕</button>
      </div>
      <div id="sheetRows" class="rows"></div>
      <div id="sheetSource" class="source-tag"></div>
      <div class="sheet-actions">
        <a id="sheetRoll" class="wide" target="_blank" rel="noopener">🏛️ Rôle actuel (propriétaire à jour)</a>
        <a id="sheetPhone" target="_blank" rel="noopener">📞 Numéro</a>
        <a id="sheetGmaps" target="_blank" rel="noopener">🧭 Carte</a>
        <button id="sheetCopy">📋 Copier</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Scripts -->
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="js/config.js?v=9"></script>
    <script src="js/app.js?v=9"></script>
  </body>
</html>
